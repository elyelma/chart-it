<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chart-It: gráficos con dibujos ilimitados. Cripto, índices, oro, petróleo y forex." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Chart-It</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand" id="brand"></div>
      <div class="vsep"></div>
      <button class="symbol-btn" id="symbolBtn" title="Buscar símbolo (Ctrl+K)">
        <span class="sym-text">
          <span class="sym-ticker" id="symTicker">—</span>
          <span class="sym-src" id="symSrc"></span>
        </span>
        <span class="sym-caret" id="symCaret"></span>
      </button>
      <button class="icon-btn star" id="starBtn" title="Añadir a la lista"></button>
      <div class="vsep"></div>
      <div class="tf-wrap">
        <button class="tf-more" id="tfMore" data-tip="Más temporalidades y las tuyas"></button>
        <div class="tf-group" id="tfGroup" role="group" aria-label="Temporalidad"></div>
      </div>
      <div class="vsep"></div>
      <button class="tb-btn" id="indBtn"></button>
      <button class="tb-btn" id="drawBtn"></button>
      <div class="spacer"></div>
      <div class="quote" id="quote">
        <span class="quote-price" id="quotePrice">—</span>
        <span class="quote-change" id="quoteChange"></span>
      </div>
      <div class="vsep"></div>
      <button class="icon-btn" id="settingsBtn" data-tip="Ajustes"></button>
      <button class="icon-btn" id="shotBtn" data-tip="Guardar imagen"></button>
      <button class="icon-btn" id="listBtn" data-tip="Mi lista"></button>
    </header>

    <main class="workspace">
      <section class="chart-wrap">
        <div id="chart" class="chart"></div>
        <div class="chart-status" id="chartStatus" hidden></div>
        <footer class="toolbar" aria-label="Herramientas de dibujo">
          <div class="tb-tools" id="tbTools"></div>
          <div class="tb-spacer"></div>
          <div class="tb-actions" id="tbActions"></div>
        </footer>
      </section>
      <aside class="watchlist" id="watchlist">
        <div class="wl-head">
          <span class="wl-title">Mi lista</span>
          <span class="wl-count" id="wlCount"></span>
          <button class="x-btn" id="wlClose" data-tip="Cerrar lista"></button>
        </div>
        <div class="wl-body" id="wlBody"></div>
      </aside>
    </main>

    <div class="props" id="props" hidden></div>
    <div class="panel draw-palette" id="drawPalette" hidden></div>
    <div class="panel tf-picker" id="tfPicker" hidden></div>
    <div class="panel ind-panel" id="indPopover" hidden></div>
    <div class="panel settings-panel" id="settingsPanel" hidden></div>
    <div class="panel ctx-menu" id="drawingMenu" hidden></div>
    <div class="panel center-panel shortcuts-panel" id="shortcutsPanel" hidden></div>

    <div class="modal-backdrop" id="searchModal" hidden>
      <div class="modal search-modal" role="dialog" aria-label="Buscar símbolo">
        <div class="search-input-wrap">
          <span class="search-icon" id="searchIcon"></span>
          <input id="searchInput" type="text" placeholder="BTC, oro, nasdaq, EURUSD, NVDA…" autocomplete="off" spellcheck="false" />
          <kbd>Esc</kbd>
          <button class="x-btn" id="searchClose" data-tip="Cerrar (Esc)"></button>
        </div>
        <div class="chips" id="searchChips"></div>
        <div class="results" id="searchResults"></div>
        <div class="search-foot" id="searchFoot"></div>
      </div>
    </div>

    <div class="modal-backdrop" id="dialog" hidden>
      <div class="modal dialog" role="dialog">
        <div class="dialog-title" id="dialogTitle"></div>
        <textarea id="dialogText" rows="3"></textarea>
        <p class="dialog-msg" id="dialogMsg"></p>
        <div class="dialog-actions">
          <button class="btn ghost" id="dialogCancel">Cancelar</button>
          <button class="btn primary" id="dialogOk">Aceptar</button>
        </div>
      </div>
    </div>

    <div class="toasts" id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
